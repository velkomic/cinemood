services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: cinemood
      POSTGRES_PASSWORD: cinemood
      POSTGRES_DB: cinemood
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cinemood -d cinemood"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://cinemood:cinemood@db/cinemood
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TMDB_SNAPSHOT_DIR: /data/snapshots
      COLLECTION_ORIGIN: ${COLLECTION_ORIGIN:-http://localhost:8000}
      COLLECTION_ALLOW_HTTP: ${COLLECTION_ALLOW_HTTP:-true}
    volumes:
      - tmdb-snapshots:/data/snapshots
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  tmdb-snapshots:
  postgres-data:
