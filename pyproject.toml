[project]
name = "cinemood"
version = "0.1.0"
description = "Small PostgreSQL-backed semantic movie discovery demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "langchain-openai>=1,<2",
  "langdetect>=1.0.9,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["cinemood"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
